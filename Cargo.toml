[package]
name = "reproductor"
version = "0.1.0"
edition = "2024"
description = "A tiny, native YouTube Music player for Windows"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SirFrey/Reproductor-Rust"
readme = "README.md"
publish = false

[dependencies]
cpal = "0.18.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
keyring = "4.2.0"
rand = "0.10.3"
rquickjs = "0.14.0"
rtrb = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
sha3 = "0.12.0"
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "unstable-winit-030"] }
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "isomp4"] }
tao = "0.37.1"
ureq = { version = "3.4.2", features = ["json"] }
url = "2.5.8"
wry = "0.57.0"

[build-dependencies]
slint-build = "1.18.1"
winresource = "0.1.34"

[features]
# UI hot reload: the running app re-reads ui/*.slint on save, no recompile.
# Use scripts/ui-dev.ps1 (it also sets SLINT_LIVE_PREVIEW for the build).
live-preview = ["slint/live-preview"]

# Day-to-day iteration: `cargo run`. Our crate compiles unoptimized (fast,
# incremental); dependencies are optimized once and cached, so decoding, the
# challenge solver and rendering still run at near-release speed.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# Builds slint-build/the .slint compiler optimized too: build.rs reruns on
# every UI change.
[profile.dev.build-override]
opt-level = 2

# Shipping build: `cargo build --release` (slow to link, smallest/fastest exe).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "ico"] }
resvg = "0.48.1"

